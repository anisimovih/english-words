<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<title>Английские слова</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EAa%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f3ff; --card: #ffffff; --text: #1e1b4b; --muted: #6b7280;
    --accent: #4f46e5; --ok: #16a34a; --bad: #dc2626; --okbg: #dcfce7; --badbg: #fee2e2;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(79,70,229,.10); margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 14px; padding: 14px 18px; font-size: 18px; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer; width: 100%; }
  button.secondary { background: #eef2ff; color: var(--accent); }
  button.small { width: auto; padding: 8px 12px; font-size: 15px; }
  button:active { transform: scale(.98); }
  input[type=text] { font: inherit; width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; font-size: 17px; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  /* parent */
  .row { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; margin-bottom: 8px; }
  .row button { padding: 0; background: #fee2e2; color: var(--bad); font-size: 20px; }
  .opts label { display: flex; gap: 10px; align-items: center; margin: 10px 0; font-size: 16px; }
  .opts input { width: 20px; height: 20px; }
  .btns { display: grid; gap: 10px; margin-top: 12px; }
  .link { word-break: break-all; font-size: 13px; background: #f3f4f6; padding: 10px; border-radius: 10px; margin-top: 10px; }

  /* child */
  .progress { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #e0e7ff; }
  .dot.done { background: var(--ok); }
  .dot.cur { background: var(--accent); transform: scale(1.25); }
  .ru { font-size: 40px; font-weight: 800; text-align: center; margin: 16px 0 22px; word-break: break-word; }
  #answer { font-size: 30px; text-align: center; padding: 14px; letter-spacing: 2px; }
  .letters { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 12px 0; }
  .l { min-width: 34px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;
    border-radius: 8px; background: var(--okbg); color: var(--ok); }
  .l.bad { background: var(--badbg); color: var(--bad); outline: 3px solid var(--bad); }
  .l.rest { background: #f3f4f6; color: var(--muted); }
  .l.miss { background: var(--badbg); color: var(--bad); outline: 3px dashed var(--bad); }
  .msg { text-align: center; font-size: 20px; font-weight: 700; margin: 10px 0; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .correct { text-align: center; font-size: 18px; margin-bottom: 14px; }
  .correct b { font-size: 24px; letter-spacing: 2px; }
  .big { font-size: 64px; text-align: center; margin: 10px 0; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
  .footer { text-align: center; margin-top: 8px; }
  .footer a { color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== PARENT ===== -->
  <section id="parent" hidden>
    <div class="card">
      <h1>Слова для ребёнка</h1>
      <p class="muted">Введите 5–10 слов: по-русски и по-английски. Потом отправьте ссылку ребёнку (или откройте на его телефоне и добавьте на главный экран).</p>
      <div id="rows"></div>
      <button class="secondary small" id="addRow">+ слово</button>
      <div class="opts">
        <label><input type="checkbox" id="optRestartAll" checked> При ошибке — начинать весь список заново</label>
        <label><input type="checkbox" id="optShuffle" checked> Перемешивать слова</label>
        <label><input type="checkbox" id="optShowCorrect" checked> После ошибки показывать правильное слово</label>
      </div>
      <input type="text" id="kidName" placeholder="Имя ребёнка (необязательно)" maxlength="30">
      <div class="btns">
        <button id="makeLink">Создать ссылку</button>
      </div>
      <div id="linkBox" hidden>
        <div class="link" id="linkText"></div>
        <div class="btns">
          <button id="shareLink">Отправить</button>
          <button class="secondary" id="copyLink">Копировать</button>
          <button class="secondary" id="openLink">Открыть тренажёр</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== CHILD ===== -->
  <section id="child" hidden>
    <div class="card">
      <div class="progress" id="progress"></div>

      <div id="ask">
        <div class="muted" style="text-align:center" id="hello">Напиши по-английски:</div>
        <div class="ru" id="ru"></div>
        <form id="form" autocomplete="off">
          <input type="text" id="answer" lang="en" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done">
          <div class="btns"><button type="submit">Проверить</button></div>
        </form>
      </div>

      <div id="result" hidden>
        <div class="msg" id="msg"></div>
        <div class="letters" id="letters"></div>
        <div class="correct" id="correct"></div>
        <button id="nextBtn"></button>
      </div>

      <div id="win" hidden>
        <div class="big">🎉</div>
        <div class="msg ok" id="winMsg"></div>
        <div class="btns"><button id="again">Ещё раз</button></div>
      </div>
    </div>
    <div class="footer"><a href="#" id="toParent">для родителей</a></div>
  </section>

  <!-- ===== BAD LINK ===== -->
  <section id="broken" hidden>
    <div class="card"><h1>Ссылка повреждена</h1><p class="muted">Попросите родителя прислать ссылку заново.</p></div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ---- link encoding: base64url(JSON) in the hash, no server needed ----
  function encode(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  }
  const norm = (s) => s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[’`]/g, "'");

  const DEFAULT = {
    w: [['кошка','cat'],['собака','dog'],['яблоко','apple'],['дом','house'],['красный','red'],['школа','school'],['книга','book']],
    r: 1, s: 1, c: 1, n: ''
  };

  // ================= PARENT =================
  function showParent() {
    $('parent').hidden = false; $('child').hidden = true; $('broken').hidden = true;
    const cfg = store.get('cfg') || DEFAULT;
    $('rows').innerHTML = '';
    cfg.w.forEach(([ru, en]) => addRow(ru, en));
    $('optRestartAll').checked = !!cfg.r;
    $('optShuffle').checked = !!cfg.s;
    $('optShowCorrect').checked = !!cfg.c;
    $('kidName').value = cfg.n || '';
    $('linkBox').hidden = true;
  }
  function addRow(ru = '', en = '') {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<input type="text" placeholder="по-русски"><input type="text" placeholder="english" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false"><button title="удалить">×</button>';
    const [a, b] = row.querySelectorAll('input');
    a.value = ru; b.value = en;
    row.querySelector('button').onclick = () => row.remove();
    $('rows').appendChild(row);
  }
  function readCfg() {
    const w = [...$('rows').querySelectorAll('.row')]
      .map(r => [...r.querySelectorAll('input')].map(i => i.value.trim()))
      .filter(([ru, en]) => ru && en);
    return { w, r: +$('optRestartAll').checked, s: +$('optShuffle').checked, c: +$('optShowCorrect').checked, n: $('kidName').value.trim() };
  }
  let link = '';
  $('addRow').onclick = () => addRow();
  $('makeLink').onclick = () => {
    const cfg = readCfg();
    if (!cfg.w.length) { alert('Добавьте хотя бы одно слово'); return; }
    store.set('cfg', cfg);
    link = location.origin + location.pathname + '#' + encode(cfg);
    $('linkText').textContent = link;
    $('linkBox').hidden = false;
    $('shareLink').hidden = !navigator.share;
  };
  $('shareLink').onclick = () => navigator.share({ title: 'Английские слова', url: link }).catch(() => {});
  $('copyLink').onclick = async () => {
    try { await navigator.clipboard.writeText(link); $('copyLink').textContent = 'Скопировано ✓'; }
    catch { prompt('Скопируйте ссылку:', link); }
    setTimeout(() => $('copyLink').textContent = 'Копировать', 1500);
  };
  $('openLink').onclick = () => { location.hash = link.split('#')[1]; };

  // ================= CHILD =================
  let cfg, order, idx;
  function startChild(c) {
    cfg = c;
    $('parent').hidden = true; $('child').hidden = false; $('broken').hidden = true;
    $('hello').textContent = cfg.n ? cfg.n + ', напиши по-английски:' : 'Напиши по-английски:';
    restart();
  }
  function restart() {
    order = cfg.w.map((_, i) => i);
    if (cfg.s) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    idx = 0; ask();
  }
  function renderProgress() {
    $('progress').innerHTML = order.map((_, i) => `<div class="dot ${i < idx ? 'done' : i === idx ? 'cur' : ''}"></div>`).join('');
  }
  function ask() {
    renderProgress();
    $('ask').hidden = false; $('result').hidden = true; $('win').hidden = true;
    $('ru').textContent = cfg.w[order[idx]][0];
    $('answer').value = '';
    $('answer').focus();
  }
  $('form').onsubmit = (e) => {
    e.preventDefault();
    const typed = norm($('answer').value);
    if (!typed) { $('answer').focus(); return; }
    const target = norm(cfg.w[order[idx]][1]);
    if (typed === target) return correct();
    wrong(typed, target);
  };
  function correct() {
    idx++;
    if (idx >= order.length) {
      renderProgress();
      $('ask').hidden = true; $('win').hidden = false;
      $('winMsg').textContent = (cfg.n ? cfg.n + ', молодец!' : 'Молодец!') + ' Все слова правильно!';
      return;
    }
    $('ask').hidden = true; $('result').hidden = false;
    $('msg').className = 'msg ok'; $('msg').textContent = 'Правильно! 👍';
    $('letters').innerHTML = ''; $('correct').textContent = '';
    $('nextBtn').textContent = 'Дальше';
    $('nextBtn').onclick = ask;
    renderProgress();
    $('nextBtn').focus();
  }
  function wrong(typed, target) {
    let p = 0;
    while (p < typed.length && p < target.length && typed[p] === target[p]) p++;
    const letters = $('letters');
    letters.innerHTML = '';
    [...typed].forEach((ch, i) => {
      const d = document.createElement('div');
      d.className = 'l' + (i < p ? '' : i === p ? ' bad' : ' rest');
      d.textContent = ch === ' ' ? '␣' : ch;
      letters.appendChild(d);
    });
    let text;
    if (p >= typed.length) {          // typed is a prefix of target: letters missing
      const d = document.createElement('div'); d.className = 'l miss'; d.textContent = '?'; letters.appendChild(d);
      text = `Не хватает букв после ${p}-й`;
    } else if (p >= target.length) {  // extra letters at the end
      text = `Лишняя буква: ${p + 1}-я`;
    } else {
      text = `Ошибка в ${p + 1}-й букве`;
    }
    $('ask').hidden = true; $('result').hidden = false;
    $('msg').className = 'msg bad'; $('msg').textContent = text;
    $('correct').innerHTML = cfg.c ? 'Правильно: <b></b>' : '';
    if (cfg.c) $('correct').querySelector('b').textContent = cfg.w[order[idx]][1];
    letters.classList.remove('shake'); void letters.offsetWidth; letters.classList.add('shake');
    if (navigator.vibrate) navigator.vibrate(200);
    $('nextBtn').textContent = cfg.r ? 'Начать всё заново' : 'Попробовать ещё раз';
    $('nextBtn').onclick = cfg.r ? restart : ask;
    $('nextBtn').focus();
  }
  $('again').onclick = restart;
  $('toParent').onclick = (e) => {
    e.preventDefault();
    if (confirm('Открыть настройки родителя?')) { store.set('cfg', cfg); history.pushState('', '', location.pathname); showParent(); }
  };

  // ================= ROUTER =================
  function route() {
    const h = location.hash.slice(1);
    if (!h) return showParent();
    try {
      const c = decode(h);
      if (!Array.isArray(c.w) || !c.w.length) throw 0;
      startChild(c);
    } catch {
      $('parent').hidden = true; $('child').hidden = true; $('broken').hidden = false;
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
